server {
    listen 80;
    server_name _;
    root /app/public;

    client_max_body_size 12M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Protected uploads: Question images served through application authorization or static if public
    location ~ ^/uploads/questions/ {
        # Protected in app controller, or internal nginx if X-Accel-Redirect
        internal;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|mp3|wav|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # Fall through to Symfony for AssetMapper-served files (dev mode)
        try_files $uri /index.php$is_args$args;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
