services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app:rw
      - app_uploads:/app/public/uploads
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:-change_in_production_4f8b2c6e9a1d3f5b}
      DATABASE_URL: postgresql://${POSTGRES_USER:-stc}:${POSTGRES_PASSWORD:-stc_secret_change_me}@postgres:5432/${POSTGRES_DB:-jdpu_stc}?serverVersion=16&charset=utf8
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - .:/app:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_uploads:/app/public/uploads:ro
    depends_on:
      - php

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jdpu_stc}
      POSTGRES_USER: ${POSTGRES_USER:-stc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stc_secret_change_me}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stc} -d ${POSTGRES_DB:-jdpu_stc}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  app_uploads:
